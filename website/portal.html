<!doctype html>
<html lang="en">
<head>
	<meta charset='UTF-8'>
	<meta name='viewport' content='width=device-width,initial-scale=1'>
	<meta http-equiv='Content-Security-Policy' content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.smartsuppchat.com https://*.smartsupp.com https://*.smartsuppchat.com https://*.smartsuppcdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.smartsuppcdn.com; img-src 'self' data: https://i.pravatar.cc https://upload.wikimedia.org https://static.smartsupp.com https://image.smartsupp.com; connect-src 'self' http://localhost:4100 https://ata-h0yo.onrender.com https://www.smartsupp.com https://app.smartsupp.com https://www.smartsuppchat.com https://bootstrap.smartsuppchat.com wss://app.smartsupp.com wss://websocket-visitors.smartsupp.com https://*.smartsuppcdn.com; font-src 'self' https://fonts.gstatic.com; frame-src https://www.smartsupp.com https://app.smartsupp.com https://*.smartsuppcdn.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
	<meta name='referrer' content='no-referrer'>
	<title>Sovereign Client Portal | All Talents Agency</title>
	<meta name="robots" content="noindex, nofollow">
	<link rel='stylesheet' href='assets/styles.css?v=20260926b'>
	<link rel='icon' href='/assets/favicon.svg' type='image/svg+xml'>
	<link rel='shortcut icon' href='/assets/favicon.svg'>
</head>
<body>
	<div class='container' id='app'></div>
	<script type='module'>
		import { request, nav, initNav, initTheme, renderRelatedRail, getRelatedTalents, initCommandPalette, initDynamicTheme } from './assets/app.js?v=20260619';
		import { loadRoster } from './assets/app.js?v=20260925';
		const CELEBRITIES = await loadRoster();

		const app = document.getElementById('app');
		app.innerHTML = `${nav('portal')}<section id='p' class='section'></section>`;

		initTheme();
		initNav();
		initDynamicTheme();
		initCommandPalette(CELEBRITIES);

		const PHASES = ['Received', 'In review', 'Terms offered', 'Confirmed'];

		function renderPhaseTimeline(currentStatus) {
			if (currentStatus === 'Declined' || currentStatus === 'Cancelled') {
				return `<p class='small muted'>This request is ${currentStatus}.</p>`;
			}
			const activeIdx = PHASES.findIndex(p => p === currentStatus);
			const nodes = PHASES.map((phase, i) => {
				const cls = i < activeIdx ? 'ph-done' : i === activeIdx ? 'ph-active' : '';
				const dot = i < activeIdx ? '-' : i + 1;
				return `<div class='phase-node ${cls}'><div class='phase-dot'>${dot}</div><div class='phase-lbl'>${phase}</div></div>`;
			}).join('');
			return `<div class='phase-strip'>${nodes}</div>`;
		}

		try {
			const d = await request('/portal/overview');
			const openCount = (d.bookings || []).filter(b => !['Confirmed','Declined','Cancelled'].includes(b.status)).length;

			const gaugeHTML = `
				<div class='card section stack'>
					<p class='eyebrow'>Your cases</p>
					<h3>${openCount} open request${openCount === 1 ? '' : 's'}</h3>
					<p class='small muted'>Status moves only when the desk updates the case. Membership: ${d.membershipTier}.</p>
				</div>`;

			document.getElementById('p').innerHTML = `
				<div class='card stack'>
					<p class='eyebrow'>Sovereign Command Center</p>
					<h2>All Talents Client Portal</h2>
					<p class='lead'>Your requests, the talent, the date, and the status the desk set.</p>
					<p class='small muted'>Membership Tier: ${d.membershipTier}</p>
				</div>

				${gaugeHTML}

				<div class='card section stack'>
					<p class='eyebrow'>Operational Logic</p>
					<div class='flow-grid'>
						<article class='flow-step'>
							<p class='num'>Layer 01</p>
							<h4>Portfolio Visibility</h4>
							<p>Track booking files and contract stages with decision-ready visibility.</p>
						</article>
						<article class='flow-step'>
							<p class='num'>Layer 02</p>
							<h4>Commercial Control</h4>
							<p>The published quote is recorded on the case. Settlement stays with the desk.</p>
						</article>
						<article class='flow-step'>
							<p class='num'>Layer 03</p>
							<h4>Service Continuity</h4>
							<p>Maintain representative message history for timeline and compliance clarity.</p>
						</article>
					</div>
				</div>

				<div class='card section stack'>
					<p class='eyebrow'>Active Booking Files</p>
					<h3>Contract & Engagement Tracker</h3>
					${d.bookings.length === 0 ? `<p class='small muted'>No active bookings. Initiate one from Explorer or Booking.</p>` : d.bookings.map(b => `
						<div class='card stack' style='margin-top:8px'>
							<div style='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px'>
								<div><p class='eyebrow'>Contract ${b.contractId}</p><h4 style='margin:4px 0'>${b.celebrityName}</h4></div>
								<span class='badge'>${b.status}</span>
							</div>
							<p class='small muted'>${b.pathway || ''} · ${b.eventType || ''} · ${b.date || 'Date TBD'} · ${b.location || 'Location TBD'}</p>
							<p class='small muted'>Published quote: <b style='color:#94B4D8'>${b.pricing && b.pricing.finalQuote ? '$' + Number(b.pricing.finalQuote).toLocaleString() : 'Desk will confirm'}</b></p>
							<p class='eyebrow' style='margin-top:8px'>Engagement Phase Tracker</p>
							${renderPhaseTimeline(b.status)}
						</div>
					`).join('')}
				</div>

				<div class='card section stack'>
					<p class='eyebrow'>Crowd access slots</p>
					<h3>Group experience bookings</h3>
					${(d.crowdSlots || []).length === 0 ? `<p class='small muted'>No crowd slots yet. <a href='crowdbooking.html#calendar'>Browse crowd events</a></p>` : (d.crowdSlots || []).map(b => `
						<div class='card stack crowd-event-card' style='margin-top:10px'>
							<p class='eyebrow'>${(b.details && b.details.slotCode) || b.contractId}</p>
							<h4 style='color:#fff;margin:4px 0'>${b.celebrityName || b.eventType}</h4>
							<p class='small' style='color:rgba(255,255,255,.6)'>${b.location || ''} · ${b.date || 'Date TBD'} · ${b.status}</p>
						</div>
					`).join('')}
				</div>

				<div class='card section stack' id='portalDiscover'></div>

				<div class='card section stack'>
					<p class='eyebrow'>Representative Communications</p>
					<h3>Client Message Archive</h3>
					<p class='small muted'>All messages are preserved as part of engagement audit continuity and support timeline clarity between inquiry and confirmation phases.</p>
					${(d.messages || []).map(m => `<p class='small'><b>${m.from}:</b> ${m.body}</p>`).join('') || '<p class="small muted">No messages currently available.</p>'}
				</div>
			`;

			renderRelatedRail(document.getElementById('portalDiscover'), getRelatedTalents(CELEBRITIES[0], CELEBRITIES), 'Discover more talent');
		} catch (e) {
			document.getElementById('p').innerHTML = `<div class='card'>${e.message}. Login first.</div>`;
		}
	</script>
</body>
</html>
