<!doctype html>
<html lang="en">
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <meta http-equiv='Content-Security-Policy' content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.smartsuppchat.com https://*.smartsupp.com https://*.smartsuppchat.com https://*.smartsuppcdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.smartsuppcdn.com; img-src 'self' data: https://i.pravatar.cc https://upload.wikimedia.org https://static.smartsupp.com https://image.smartsupp.com; connect-src 'self' http://localhost:4100 https://ata-h0yo.onrender.com https://www.smartsupp.com https://app.smartsupp.com https://www.smartsuppchat.com https://bootstrap.smartsuppchat.com wss://app.smartsupp.com wss://websocket-visitors.smartsupp.com https://*.smartsuppcdn.com; font-src 'self' https://fonts.gstatic.com; frame-src https://www.smartsupp.com https://app.smartsupp.com https://*.smartsuppcdn.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
  <meta name='referrer' content='no-referrer'>
  <title>Crowd Access | All Talents Agency (ATA)</title>
  <meta name="application-name" content="All Talents Agency">
  <meta name="apple-mobile-web-app-title" content="ATA">
  <meta name="theme-color" content="#060809">
  <meta name="msapplication-TileColor" content="#A8BDD9">
  <link rel='apple-touch-icon' href='/assets/ata-mark.svg'>
  <!-- SEO: Primary Meta -->
  <meta name="description" content="Buy crowd access tickets to exclusive celebrity events - VIP concerts, gala dinners, and private appearances. Flexible payment plans. Join world-famous celebrities at unforgettable events.">
  <meta name="keywords" content="celebrity event tickets, VIP celebrity experience, exclusive celebrity events, celebrity concert tickets, star-studded gala, celebrity meet and greet, crowd booking">
  <meta name="robots" content="index, follow">
  <meta name="author" content="All Talents Agency">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Crowd Access | All Talents Agency">
  <meta property="og:description" content="Attend private concerts, galas, and VIP events alongside world-famous celebrities. Flexible payment plans available.">
  <meta property="og:url" content="https://alltalentsagency.com/crowdbooking.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Crowd Access | All Talents Agency">
  <meta name="twitter:description" content="VIP crowd access to private celebrity events worldwide. Concerts, galas, and exclusive appearances.">
  <link rel="canonical" href="https://alltalentsagency.com/crowdbooking.html">
  <link rel='icon' href='/assets/favicon.svg' type='image/svg+xml'>
  <link rel='shortcut icon' href='/assets/favicon.svg'>
  <link rel='stylesheet' href='assets/styles.css?v=20261022a'>
</head>
<body>
	<div id="ataBoot" class="ata-boot" role="status" aria-live="polite"><div class="ata-boot-mark" aria-hidden="true">ATA</div><div class="ata-boot-track" aria-hidden="true"><span></span></div><p class="ata-boot-label">Opening the desk</p></div>
	<script>window.__ataBootAt=Date.now();setTimeout(function(){var b=document.getElementById('ataBoot');if(b)b.classList.add('ata-boot-done');document.documentElement.classList.add('is-hydrated');},24000);</script>
	<div class='container' id='app'></div>

	<script type='module'>
    import { request, nav, currentUser, initNav, initTheme, trackEvent, initCommandPalette, initDynamicTheme, loadRoster } from './assets/app.js?v=20260926d';
    const CELEBRITIES = await loadRoster();

    (async () => {

    const app = document.getElementById('app');
    // Pre-select celeb from URL param
    const urlParam = new URLSearchParams(window.location.search).get('celeb');

    const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[char]);

    app.innerHTML = `
      ${nav('crowd')}
      <section class='crowd-hero section'>
        <div class='crowd-hero-label'>Crowd Access</div>
        <h2>Join a Group.<br><span>Access an Icon.</span></h2>
        <p class='lead' style='max-width:620px;margin:10px 0 0'>Browse group-access opportunities and request an introduction. A listing is not a confirmed appearance; all dates, availability, pricing, and access are subject to approval by authorized representation.</p>
        <div class='crowd-how'>
          <div class='crowd-how-step'>
            <p class='ch-num'>Step 01</p>
            <h4>Choose Your Event</h4>
            <p>Browse event listings or submit an availability request. The desk must confirm each opportunity.</p>
          </div>
          <div class='crowd-how-step'>
            <p class='ch-num'>Step 02</p>
            <h4>Select Your Plan</h4>
            <p>See the indicative per-person estimate. Final event details and pricing require representative approval.</p>
          </div>
          <div class='crowd-how-step'>
            <p class='ch-num'>Step 03</p>
            <h4>Claim Your Slot</h4>
            <p>Submit a request for review. No place is reserved until the desk confirms it.</p>
          </div>
          <div class='crowd-how-step'>
            <p class='ch-num'>Step 04</p>
            <h4>Attend & Experience</h4>
            <p>Attend only after the date, terms, and access are confirmed in writing.</p>
          </div>
        </div>
      </section>

      <section class='card section stack' style='padding:14px 18px'>
        <div style='display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px'>
          <div>
            <p class='eyebrow'>Upcoming Verified Events</p>
            <p class='small muted' style='margin-top:2px'>Event dates and access are confirmed by authorized representatives. Availability requests do not guarantee an appearance or incur a charge.</p>
          </div>
          <div class='crowd-filters'>
            <input id='filterTalent' type='search' placeholder='Search talent or event' aria-label='Search talent or event'>
            <select id='filterCat'>
              <option value='All'>All Categories</option>
            </select>
            <select id='filterPrice'>
              <option value='0'>Any Price</option>
              <option value='2000'>Under $2,000</option>
              <option value='3500'>Under $3,500</option>
              <option value='5000'>Under $5,000</option>
            </select>
          </div>
        </div>
      </section>

      <section class='grid g3 section' id='calendar'>
        ${[1,2,3,4,5,6].map(() => `<div class='card' style='height:340px;background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.05)'></div>`).join('')}
      </section>

      <section class='card section' style='text-align:center;padding:32px'>
        <p class='eyebrow'>Prefer Exclusive Private Access?</p>
        <h3 style='margin:8px 0 8px'>Book a Sole Private Meeting</h3>
        <p class='small muted' style='max-width:480px;margin:0 auto 16px'>Crowd Access is designed for maximum value. If your engagement requires total privacy, a sole event, or sovereign-tier presence - explore private bookings in Explorer.</p>
        <a href='explorer.html'><button class='primary' style='width:auto;padding:12px 28px;font-size:11px;letter-spacing:.08em;text-transform:uppercase'>Open Explorer -</button></a>
      </section>
    `;

    initTheme();
    initNav();
    initDynamicTheme();
    initCommandPalette(CELEBRITIES);

    let allEvents = [];
    try {
      const res = await request('/crowd-events');
      allEvents = res.data;
    } catch(e) {
      document.getElementById('calendar').innerHTML = `<div class='card' style='grid-column:1/-1;padding:40px;text-align:center'><p class='muted'>Unable to load events - API unavailable.</p></div>`;
      return;
    }

    if (urlParam) {
      const mine = allEvents.filter((ev) => ev.celebId === urlParam);
      if (mine.length) allEvents = mine;
    }

    const filterCat = document.getElementById('filterCat');
    const filterTalent = document.getElementById('filterTalent');
    for (const category of [...new Set(allEvents.map(event => event.category).filter(Boolean))].sort()) {
      const option = document.createElement('option');
      option.value = category;
      option.textContent = category;
      filterCat.append(option);
    }

    allEvents.sort((a, b) => {
      const featured = event => ['c244', 'c245'].includes(event.celebId) ? 0 : 1;
      return featured(a) - featured(b) || String(a.date).localeCompare(String(b.date));
    });
    let visibleCount = 12;

    function fmtDate(d) {
      const dt = new Date(d + 'T00:00:00');
      return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }
    function fmtPrice(p) { return '$' + p.toLocaleString(); }

    function renderEvents(events) {
      if (!events.length) {
        document.getElementById('calendar').innerHTML = `<div class='card' style='grid-column:1/-1;padding:40px;text-align:center'><p class='muted'>No events match your filters.</p></div>`;
        return;
      }
      const displayedEvents = events.slice(0, visibleCount);
      document.getElementById('calendar').innerHTML = displayedEvents.map((ev, index) => {
        const avail = ev.slots - ev.claimed;
        const pct = ev.soldPct;
        const isFull = !ev.requestOnly && avail <= 0;
        const eventId = escapeHTML(ev.id);
        const eventName = escapeHTML(ev.name);
        const price = ev.requestOnly ? ev.estimatedPricePerSlot : ev.pricePerSlot;
        return `
          <article class='crowd-event-card${ev.requestOnly ? ' ce-request-only' : ''}' id='card-${eventId}'>
            <div class='ce-header'>
              <div class='ce-head-row'>
                <img class='ce-portrait' src='${escapeHTML(ev.portrait)}' alt='${eventName}' width='72' height='88' loading='${index < 2 ? 'eager' : 'lazy'}' fetchpriority='${index < 2 ? 'high' : 'auto'}' decoding='async'>
                <div class='ce-head-copy'>
                  <div class='ce-event-type'>${escapeHTML(ev.requestOnly ? 'Availability request · Not confirmed' : ev.eventType)}</div>
                  <div class='ce-title'>${escapeHTML(ev.eventTitle)}</div>
                  <div class='ce-meta'>${ev.requestOnly ? `Date and access to be confirmed · ${eventName}` : `${escapeHTML(ev.city)} · ${fmtDate(ev.date)} · ${eventName}`}</div>
                </div>
              </div>
            </div>
            <div class='ce-body'>
              ${ev.requestOnly ? `<p class='ce-request-note'>This is an inquiry only. No event, date, appearance, price, or access is confirmed. The representative must approve any next steps.</p>` : `<div class='ce-slots'>
                <div class='ce-slots-top'>
                  <span class='ce-slots-label'>Slots Claimed</span>
                  <span class='ce-slots-count'>${isFull ? '- SOLD OUT' : `${avail} of ${ev.slots} remaining`}</span>
                </div>
                <div class='ce-slot-bar'><div class='ce-slot-fill${pct >= 80 ? " sf-critical" : ""}' style='width:${pct}%'></div></div>
              </div>`}

              <div style='margin-bottom:10px'>
                ${Number.isFinite(Number(price)) && Number(price) > 0 ? `<div class='ce-price-row'>
                  <span class='ce-price-main'>${ev.requestOnly ? 'From ' : ''}${fmtPrice(Number(price))}</span>
                  <span class='ce-price-sub'>${ev.requestOnly ? 'indicative / person' : 'published slot'}</span>
                </div>` : `<div class='ce-request-price'>Price estimate available on request</div>`}
                <p class='small muted' style='margin:3px 0 8px;font-size:11px'>${ev.requestOnly ? 'Indicative estimate only, based on the published starting rate and talent category. Final pricing requires representative approval; no event or appearance is confirmed.' : `${avail} places left. The desk confirms settlement. Nothing is charged here.`}</p>
              </div>

              <div class='ce-includes'>
                ${ev.includes.map(i => `<span>${escapeHTML(i)}</span>`).join('')}
              </div>

              <button class='ce-join-btn' type='button' data-ev='${eventId}' aria-expanded='false' ${isFull ? 'disabled' : ''}>${isFull ? 'Fully Claimed' : ev.requestOnly ? 'Request availability' : 'Request a slot'}</button>
            </div>
          </article>
        `;
      }).join('');
      if (events.length > visibleCount) {
        document.getElementById('calendar').insertAdjacentHTML('beforeend', `<button id='loadMoreEvents' class='secondary' type='button' style='grid-column:1/-1;justify-self:center;width:auto;padding:12px 28px'>Load more events (${events.length - visibleCount} remaining)</button>`);
        document.getElementById('loadMoreEvents').onclick = () => {
          visibleCount += 12;
          renderEvents(getFiltered());
        };
      }

      document.querySelectorAll('.ce-join-btn').forEach(btn => {
        btn.onclick = () => {
          const evId = btn.dataset.ev;
          const ev = allEvents.find(e => e.id === evId);
          openAvailabilityForm(ev, btn);
        };
      });

      // Highlight pre-selected celeb if URL param
      if (urlParam) {
        const match = document.querySelector(`[data-ev]`);
        if (match) {
          const found = allEvents.find(e => e.celebId === urlParam);
          if (found) {
            const el = document.getElementById('card-' + found.id);
            if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.style.borderColor = 'rgba(159,230,176,.7)'; el.style.boxShadow = '0 0 0 2px rgba(159,230,176,.25)'; }
          }
        }
      }
    }

    function openAvailabilityForm(ev, triggerBtn) {
      const card = document.getElementById(`card-${ev.id}`);
      const body = card?.querySelector('.ce-body');
      if (!body) return;
      const currentForm = document.getElementById('crowdRequestForm');
      if (currentForm) {
        const previousButton = currentForm.parentElement?.querySelector('.ce-join-btn');
        if (previousButton) previousButton.setAttribute('aria-expanded', 'false');
        currentForm.remove();
      }
      const form = document.createElement('form');
      form.id = 'crowdRequestForm';
      form.className = 'crowd-request-form';
      form.innerHTML = `
        <h3>${ev.requestOnly ? 'Request availability' : 'Request a place'}</h3>
        <p class='small muted'>${ev.requestOnly ? 'This sends an interest inquiry only. No event or appearance is confirmed, and no charge is made.' : 'The desk will confirm the place and settlement. No charge is made on this page.'}</p>
        <label>Name<input name='clientName' autocomplete='name' maxlength='160' required value='${escapeHTML(currentUser()?.name || '')}'></label>
        <label>Email<input name='clientEmail' type='email' autocomplete='email' maxlength='254' required value='${escapeHTML(currentUser()?.email || '')}'></label>
        <div class='crowd-request-actions'>
          <button class='ce-join-btn' type='submit'>Send request</button>
          <button class='ce-request-cancel' type='button'>Cancel</button>
        </div>
        <p class='crowd-request-status' role='status' aria-live='polite'></p>
      `;
      body.append(form);
      triggerBtn.setAttribute('aria-expanded', 'true');
      form.querySelector('.ce-request-cancel').onclick = () => {
        triggerBtn.setAttribute('aria-expanded', 'false');
        form.remove();
      };
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const submit = form.querySelector('[type=submit]');
        const status = form.querySelector('[role=status]');
        submit.disabled = true;
        submit.textContent = 'Sending request...';
        try {
          const fields = new FormData(form);
          const res = await request(`/crowd-events/${encodeURIComponent(ev.id)}/join`, {
            method: 'POST',
            body: JSON.stringify({
              clientName: fields.get('clientName'),
              clientEmail: fields.get('clientEmail'),
            }),
          });
          trackEvent('crowd_join', { eventId: ev.id, celebId: ev.celebId });
          status.textContent = res.message;
          submit.textContent = 'Request sent';
          if (!ev.requestOnly) {
            ev.claimed += 1;
            ev.available = Math.max(0, ev.slots - ev.claimed);
            const count = card.querySelector('.ce-slots-count');
            if (count) count.textContent = ev.available ? `${ev.available} of ${ev.slots} remaining` : 'Fully claimed';
            submit.disabled = true;
          } else {
            submit.hidden = true;
          }
        } catch (error) {
          status.textContent = error.message;
          submit.disabled = false;
          submit.textContent = 'Send request';
        }
      });
      form.querySelector('input')?.focus({ preventScroll: true });
    }

    function getFiltered() {
      const cat = filterCat?.value || 'All';
      const maxP = parseInt(document.getElementById('filterPrice')?.value || '0');
      const search = filterTalent?.value.trim().toLocaleLowerCase() || '';
      return allEvents.filter(ev => {
        if (cat !== 'All' && ev.category !== cat) return false;
        const price = ev.requestOnly ? ev.estimatedPricePerSlot : ev.pricePerSlot;
        if (maxP > 0 && price > maxP) return false;
        if (search && !`${ev.name} ${ev.eventTitle} ${ev.eventType}`.toLocaleLowerCase().includes(search)) return false;
        return true;
      });
    }

    renderEvents(allEvents);

    filterCat.onchange = () => { visibleCount = 12; renderEvents(getFiltered()); };
    document.getElementById('filterPrice').onchange = () => { visibleCount = 12; renderEvents(getFiltered()); };
    filterTalent.oninput = () => { visibleCount = 12; renderEvents(getFiltered()); };

    })(); // end async IIFE
  </script>
</body>
</html>
