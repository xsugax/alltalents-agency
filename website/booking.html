<!doctype html>
<html lang="en">
<head>
	<meta charset='UTF-8'>
	<meta name='viewport' content='width=device-width,initial-scale=1'>
	<meta http-equiv='Content-Security-Policy' content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://i.pravatar.cc; connect-src 'self' http://localhost:4100 https://ata-h0yo.onrender.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
	<meta name='referrer' content='no-referrer'>
	<title>Sovereign Booking | All Talents Agency</title>
	<meta name="robots" content="noindex, nofollow">
	<link rel='stylesheet' href='assets/styles.css?v=20260611'>
	<link rel='icon' href='/assets/favicon.svg' type='image/svg+xml'>
</head>
<body>
	<div class='container' id='app'></div>
	<script type='module'>
		import {
			request, nav, currentUser, loadTicker, buildCryptoPaymentHTML, initCryptoWidget,
			initNav, initTheme, requireAuth, renderRelatedRail, getRelatedTalents,
			bindShortlistTray, trackEvent, initCommandPalette, initDynamicTheme,
			renderProtocolSpine, getAccessProgress, renderEscrowLedger, displayPrice, initAccessProtocol
		} from './assets/app.js?v=20260611';
		import { CELEBRITIES } from './assets/celebrities-data.js';

		const qs = new URLSearchParams(location.search);
		const id = qs.get('id');
		const preVenue = qs.get('venue') || '';
		const preDate = qs.get('date') || '';

		const app = document.getElementById('app');
		app.innerHTML = `${nav('booking')}<section class='section' id='bkRoot'></section>`;
		loadTicker(); initTheme(); initNav();
		initDynamicTheme(); initCommandPalette(CELEBRITIES);
		bindShortlistTray(CELEBRITIES);
		initAccessProtocol();

		if (!id) {
			document.getElementById('bkRoot').innerHTML = '<div class="card"><h3>No celebrity selected</h3><p class="muted"><a href="explorer.html">Explorer</a></p></div>';
			throw new Error('no id');
		}

		const c = await request('/celebrities/' + id);
		trackEvent('booking_view', { id });

		let step = 0;
		let selectedDate = preDate;
		let availMsg = '';

		const related = await request('/celebrities/' + id + '/related').catch(() => ({
			data: getRelatedTalents(c, CELEBRITIES),
		}));

		function projectedQuote() {
			const adjust = Number(document.getElementById('adjust')?.value || 0);
			const security = document.getElementById('security')?.value || 'Standard';
			const securityFactor = security === 'Sovereign' ? 1.18 : security === 'Executive' ? 1.1 : security === 'Enhanced' ? 1.05 : 1;
			return Math.round(c.startingPrice * (1 + adjust / 100) * securityFactor);
		}

		function render() {
			const quote = projectedQuote();
			const escrow = Math.round(quote * 0.3);
			const root = document.getElementById('bkRoot');
			root.innerHTML = `
				${renderProtocolSpine(Math.max(getAccessProgress().step, 4))}
				<div class="booking-wizard">
					<article class="card stack">
						<div class="bk-steps">
							<span class="bk-step ${step === 0 ? 'bk-active' : step > 0 ? 'bk-done' : ''}">01 Experience</span>
							<span class="bk-step ${step === 1 ? 'bk-active' : step > 1 ? 'bk-done' : ''}">02 Logistics</span>
							<span class="bk-step ${step === 2 ? 'bk-active' : step > 2 ? 'bk-done' : ''}">03 Commercial</span>
							<span class="bk-step ${step === 3 ? 'bk-active' : ''}">04 Settlement</span>
						</div>
						<div class="bk-panel ${step === 0 ? 'bk-show' : ''}" data-step="0">
							<p class="eyebrow">Executive booking desk</p>
							<h2>Your engagement with ${c.name}</h2>
							<div class="experience-preview">
								<img src="${c.portrait}" alt="">
								<div>
									<p class="lead" style="margin:0 0 10px">${c.eliteSignal || 'Sovereign private access — representation-first pathway.'}</p>
									<p class="small muted">${displayPrice(c.startingPrice)} · ${c.availability} · ${c.category}</p>
								</div>
							</div>
							<button type="button" class="primary" id="bkNext0" style="width:auto;margin-top:16px">Continue to logistics →</button>
						</div>
						<div class="bk-panel ${step === 1 ? 'bk-show' : ''}" data-step="1">
							<p class="eyebrow">Logistics</p>
							<div class="grid g2">
								<input id="eventType" value="Gala" placeholder="Event type">
								<input id="date" type="date" value="${selectedDate}">
								<input id="location" value="${preVenue ? decodeURIComponent(preVenue) : 'Dubai'}" placeholder="Location">
								<select id="security">${c.securityTiers.map(s => `<option>${s}</option>`).join('')}</select>
							</div>
							<textarea id="rider" rows="3" style="margin-top:10px">Private lounge protocol + secure arrival corridor.</textarea>
							<p class="small muted" id="availStatus">${availMsg || 'Select a date to verify availability pulse.'}</p>
							<div style="display:flex;gap:10px;margin-top:14px">
								<button type="button" class="secondary" id="bkBack1" style="width:auto">← Back</button>
								<button type="button" class="primary" id="bkNext1" style="width:auto">Commercial quote →</button>
							</div>
						</div>
						<div class="bk-panel ${step === 2 ? 'bk-show' : ''}" data-step="2">
							<p class="eyebrow">Commercial</p>
							<label class="small muted">Pricing sensitivity</label>
							<input id="adjust" type="range" min="-15" max="50" value="0">
							<div class="quote-line"><span>Projected quote</span><strong id="simQuote">$${quote.toLocaleString()}</strong></div>
							${renderEscrowLedger({ quote, escrowPct: 30 })}
							<button type="button" class="secondary" id="genPlan" style="margin-top:12px">Generate executive scenario</button>
							<p class="small muted" id="planOut">${currentUser() ? 'Optional strategy brief.' : 'Login for blueprint generation.'}</p>
							<div style="display:flex;gap:10px;margin-top:14px">
								<button type="button" class="secondary" id="bkBack2" style="width:auto">← Back</button>
								<button type="button" class="primary" id="bkNext2" style="width:auto">Settlement →</button>
							</div>
						</div>
						<div class="bk-panel ${step === 3 ? 'bk-show' : ''}" data-step="3">
							<p class="eyebrow">Settlement</p>
							<div id="paymentWidgetWrap"></div>
							<button type="button" class="primary" id="submit" style="margin-top:14px">Confirm booking submission</button>
							<p class="small muted" id="msg"></p>
							<button type="button" class="secondary" id="bkBack3" style="width:auto;margin-top:8px">← Back</button>
						</div>
					</article>
					<aside class="card stack" id="bkSidebar">
						<p class="eyebrow">Add another engagement</p>
						<div id="bkRelated"></div>
					</aside>
				</div>`;

			renderRelatedRail(document.getElementById('bkRelated'), related.data || [], 'Clients also pursued');

			const refreshQuote = () => {
				const q = projectedQuote();
				const sq = document.getElementById('simQuote');
				if (sq) sq.textContent = `$${q.toLocaleString()}`;
				const ledger = document.querySelector('.escrow-ledger');
				if (ledger) ledger.outerHTML = renderEscrowLedger({ quote: q, escrowPct: 30 });
			};

			document.getElementById('bkNext0')?.addEventListener('click', () => { step = 1; render(); });
			document.getElementById('bkBack1')?.addEventListener('click', () => { step = 0; render(); });
			document.getElementById('bkNext1')?.addEventListener('click', () => { step = 2; render(); });
			document.getElementById('bkBack2')?.addEventListener('click', () => { step = 1; render(); });
			document.getElementById('bkNext2')?.addEventListener('click', () => { step = 3; render(); bindPay(); });
			document.getElementById('bkBack3')?.addEventListener('click', () => { step = 2; render(); });

			document.getElementById('date')?.addEventListener('change', async (e) => {
				selectedDate = e.target.value;
				const st = document.getElementById('availStatus');
				if (!selectedDate) return;
				try {
					const a = await request(`/celebrities/${id}/availability?date=${selectedDate}`);
					availMsg = a.message || a.status;
					if (st) st.textContent = availMsg;
				} catch (err) {
					if (st) st.textContent = err.message;
				}
			});

			document.getElementById('adjust')?.addEventListener('input', refreshQuote);
			document.getElementById('security')?.addEventListener('change', refreshQuote);

			document.getElementById('genPlan')?.addEventListener('click', async () => {
				const out = document.getElementById('planOut');
				if (!currentUser()) { out.textContent = 'Login required for blueprint.'; return; }
				try {
					const strategy = await request('/intelligence/blueprint', {
						method: 'POST',
						body: JSON.stringify({
							celebrityId: id,
							objective: `Premium ${document.getElementById('eventType').value}`,
							audienceType: 'VIP stakeholders',
							region: document.getElementById('location').value,
							budget: projectedQuote(),
							timelineDays: 21,
						}),
					});
					out.innerHTML = `<b>${strategy.blueprintId}</b> — ${strategy.strategy.recommendation}`;
				} catch (e) {
					out.textContent = e.message;
				}
			});

			if (step === 3) bindPay();
		}

		let cryptoWidget;
		function bindPay() {
			document.getElementById('paymentWidgetWrap').innerHTML = buildCryptoPaymentHTML('bk');
			cryptoWidget = initCryptoWidget('bk');
			document.getElementById('submit').onclick = async () => {
				if (!requireAuth(`booking.html?id=${id}&venue=${encodeURIComponent(document.getElementById('location').value)}&date=${document.getElementById('date').value}`)) return;
				const msg = document.getElementById('msg');
				try {
					const payMethod = cryptoWidget.getMethod();
					const r = await request('/bookings/initiate', {
						method: 'POST',
						body: JSON.stringify({
							celebrityId: id,
							eventType: document.getElementById('eventType').value,
							date: document.getElementById('date').value,
							location: document.getElementById('location').value,
							ndaRequired: true,
							securityLevel: document.getElementById('security').value,
							riderRequirements: document.getElementById('rider').value,
							pricingAdjustmentPercent: Number(document.getElementById('adjust').value),
							paymentMethod: payMethod,
						}),
					});
					trackEvent('booking_initiate', { id, bookingId: r.booking.id });
					msg.innerHTML = `<div class="bk-success-pulse card" style="margin-top:12px;padding:16px">
						<p class="eyebrow">Engagement recorded</p>
						<p><b>${r.booking.id.slice(0, 8)}</b> · Contract ${r.booking.contractId}</p>
						<p class="small muted">Representation review within 24h. <a href="portal.html">Open portal →</a></p>
					</div>`;
				} catch (e) {
					msg.textContent = e.message;
				}
			};
		}

		render();
		if (preDate) {
			request(`/celebrities/${id}/availability?date=${preDate}`).then(a => {
				availMsg = a.message || a.status;
			}).catch(() => {});
		}
	</script>
</body>
</html>
